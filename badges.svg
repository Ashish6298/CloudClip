<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 130" width="100%" height="100%" style="background: transparent;">
  <style>
    .badge-icon {
      transform-origin: 50px 14px;
      animation: floatBadge 4s infinite ease-in-out;
    }
    .b-1 { animation-delay: 0s; }
    .b-2 { animation-delay: 0.6s; }
    .b-3 { animation-delay: 1.2s; }
    .b-4 { animation-delay: 1.8s; }
    .b-5 { animation-delay: 2.4s; }
    
    .desc-text {
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
      font-size: 14px;
      fill: #94a3b8;
      text-anchor: middle;
      font-weight: 500;
      animation: glowPulse 4s infinite ease-in-out;
    }
    
    @keyframes floatBadge {
      0% { transform: translateY(0px) rotate(0deg) scale(1); }
      50% { transform: translateY(-8px) rotate(2deg) scale(1.03); }
      100% { transform: translateY(0px) rotate(0deg) scale(1); }
    }
    
    @keyframes glowPulse {
      0% { fill: #94a3b8; }
      50% { fill: #f8fafc; }
      100% { fill: #94a3b8; }
    }
  </style>

  <!-- React Badge -->
  <g class="badge-icon b-1" transform="translate(90, 15)">
    <rect width="110" height="30" rx="8" fill="#1a1c23" stroke="#61dafb" stroke-width="1.5" />
    <text x="55" y="19" fill="#61dafb" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="bold" text-anchor="middle">React 19.0</text>
  </g>

  <!-- Node.js Badge -->
  <g class="badge-icon b-2" transform="translate(215, 15)">
    <rect width="110" height="30" rx="8" fill="#182618" stroke="#339933" stroke-width="1.5" />
    <text x="55" y="19" fill="#339933" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Node.js v18+</text>
  </g>

  <!-- Express Badge -->
  <g class="badge-icon b-3" transform="translate(340, 15)">
    <rect width="110" height="30" rx="8" fill="#0f1115" stroke="#ffffff" stroke-width="1.5" opacity="0.9" />
    <text x="55" y="19" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Express 4.21</text>
  </g>

  <!-- Vite Badge -->
  <g class="badge-icon b-4" transform="translate(465, 15)">
    <rect width="110" height="30" rx="8" fill="#1b1c2e" stroke="#646cff" stroke-width="1.5" />
    <text x="55" y="19" fill="#a855f7" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Vite 8.0</text>
  </g>

  <!-- License Badge -->
  <g class="badge-icon b-5" transform="translate(590, 15)">
    <rect width="110" height="30" rx="8" fill="#1a2421" stroke="#10b981" stroke-width="1.5" />
    <text x="55" y="19" fill="#10b981" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="bold" text-anchor="middle">License MIT</text>
  </g>

  <!-- Description Text Lines -->
  <text x="400" y="85" class="desc-text">A production-ready, full-stack media extraction platform designed for fast, high-quality downloads and stream conversions.</text>
  <text x="400" y="110" class="desc-text">Powered by <tspan fill="#6366f1" font-weight="bold">yt-dlp</tspan> with Node JS signature solvers and <tspan fill="#ec4899" font-weight="bold">ffmpeg</tspan> stream muxers.</text>
</svg>
