<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 130" width="100%" height="100%" style="background: transparent;">
  <defs>
    <!-- React 3D Gradients -->
    <linearGradient id="reactGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4fd8f9" />
      <stop offset="100%" stop-color="#00a8cc" />
    </linearGradient>
    
    <!-- Node 3D Gradients -->
    <linearGradient id="nodeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#56b856" />
      <stop offset="100%" stop-color="#276b27" />
    </linearGradient>

    <!-- Express 3D Gradients -->
    <linearGradient id="expressGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#555555" />
      <stop offset="100%" stop-color="#1a1a1a" />
    </linearGradient>

    <!-- Vite 3D Gradients -->
    <linearGradient id="viteGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#bd34fe" />
      <stop offset="100%" stop-color="#411b9b" />
    </linearGradient>

    <!-- License 3D Gradients -->
    <linearGradient id="licenseGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
  </defs>

  <style>
    .desc-text {
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
      font-size: 14px;
      fill: #94a3b8;
      text-anchor: middle;
      font-weight: 500;
    }
  </style>

  <!-- React 3D Badge -->
  <g transform="translate(90, 15)">
    <rect x="0" y="3" width="110" height="30" rx="8" fill="#085466" />
    <rect x="0" y="0" width="110" height="30" rx="8" fill="url(#reactGrad)" />
    <text x="55" y="19" fill="#08252e" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="800" text-anchor="middle">React 19.0</text>
  </g>

  <!-- Node 3D Badge -->
  <g transform="translate(215, 15)">
    <rect x="0" y="3" width="110" height="30" rx="8" fill="#133d13" />
    <rect x="0" y="0" width="110" height="30" rx="8" fill="url(#nodeGrad)" />
    <text x="55" y="19" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="800" text-anchor="middle">Node.js v18+</text>
  </g>

  <!-- Express 3D Badge -->
  <g transform="translate(340, 15)">
    <rect x="0" y="3" width="110" height="30" rx="8" fill="#000000" />
    <rect x="0" y="0" width="110" height="30" rx="8" fill="url(#expressGrad)" />
    <text x="55" y="19" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="800" text-anchor="middle">Express 4.21</text>
  </g>

  <!-- Vite 3D Badge -->
  <g transform="translate(465, 15)">
    <rect x="0" y="3" width="110" height="30" rx="8" fill="#240c5c" />
    <rect x="0" y="0" width="110" height="30" rx="8" fill="url(#viteGrad)" />
    <text x="55" y="19" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="800" text-anchor="middle">Vite 8.0</text>
  </g>

  <!-- License 3D Badge -->
  <g transform="translate(590, 15)">
    <rect x="0" y="3" width="110" height="30" rx="8" fill="#045e41" />
    <rect x="0" y="0" width="110" height="30" rx="8" fill="url(#licenseGrad)" />
    <text x="55" y="19" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="800" text-anchor="middle">License MIT</text>
  </g>

  <!-- Description Text Lines -->
  <text x="400" y="85" class="desc-text">A production-ready, full-stack media extraction platform designed for fast, high-quality downloads and stream conversions.</text>
  <text x="400" y="110" class="desc-text">Powered by <tspan fill="#6366f1" font-weight="bold">yt-dlp</tspan> with Node JS signature solvers and <tspan fill="#ec4899" font-weight="bold">ffmpeg</tspan> stream muxers.</text>
</svg>
