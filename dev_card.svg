<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="100%" height="100%" style="background: #070a13; border-radius: 16px;">
  <defs>
    <!-- Gradients -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(30, 41, 59, 0.75)" />
      <stop offset="100%" stop-color="rgba(15, 23, 42, 0.9)" />
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.4" />
      <stop offset="50%" stop-color="#a855f7" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0.4" />
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <filter id="cardGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    .text-title {
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif;
      font-weight: 700;
      fill: #ffffff;
      font-size: 16px;
      letter-spacing: 1.5px;
    }
    .text-body {
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif;
      font-weight: 400;
      fill: #94a3b8;
      font-size: 14px;
    }
    .text-bold {
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif;
      font-weight: 600;
      fill: #f1f5f9;
      font-size: 14px;
    }
    .card-element {
      transform-origin: 400px 200px;
      animation: floatCard 6s infinite ease-in-out;
    }
    @keyframes floatCard {
      0% { transform: translateY(0px) rotateX(1.5deg) rotateY(-1.5deg); }
      50% { transform: translateY(-8px) rotateX(-1.5deg) rotateY(1.5deg); }
      100% { transform: translateY(0px) rotateX(1.5deg) rotateY(-1.5deg); }
    }
  </style>

  <!-- Background base -->
  <rect width="800" height="400" fill="#070a13" rx="16" />

  <!-- Glowing background blobs -->
  <circle cx="200" cy="200" r="100" fill="#6366f1" opacity="0.08" filter="url(#cardGlow)" />
  <circle cx="600" cy="200" r="120" fill="#ec4899" opacity="0.07" filter="url(#cardGlow)" />

  <g class="card-element">
    <!-- LEFT PANEL: Info & Badges Card -->
    <rect x="40" y="40" width="340" height="320" rx="12" fill="url(#cardGrad)" stroke="url(#borderGrad)" stroke-width="1.5" />
    
    <text x="60" y="80" class="text-title">SYSTEM PLATFORM</text>
    <text x="60" y="115" class="text-body">A production-ready full-stack media</text>
    <text x="60" y="135" class="text-body">extraction framework. Powered by yt-dlp</text>
    <text x="60" y="155" class="text-body">and FFmpeg muxers for seamless high-</text>
    <text x="60" y="175" class="text-body">definition stream merges.</text>

    <!-- 3D Styled SVG Badges -->
    <g transform="translate(60, 210)">
      <!-- React Badge -->
      <rect x="0" y="0" width="100" height="30" rx="6" fill="#1e293b" stroke="#61DAFB" stroke-width="1" />
      <text x="50" y="19" font-family="sans-serif" font-weight="700" fill="#61DAFB" font-size="11" text-anchor="middle">REACT 19</text>

      <!-- Node Badge -->
      <rect x="110" y="0" width="100" height="30" rx="6" fill="#1e293b" stroke="#339933" stroke-width="1" />
      <text x="160" y="19" font-family="sans-serif" font-weight="700" fill="#339933" font-size="11" text-anchor="middle">NODEJS</text>

      <!-- Express Badge -->
      <rect x="0" y="40" width="100" height="30" rx="6" fill="#1e293b" stroke="#ffffff" stroke-width="1" opacity="0.9" />
      <text x="50" y="59" font-family="sans-serif" font-weight="700" fill="#ffffff" font-size="11" text-anchor="middle">EXPRESS</text>

      <!-- Vite Badge -->
      <rect x="110" y="40" width="100" height="30" rx="6" fill="#1e293b" stroke="#646CFF" stroke-width="1" />
      <text x="160" y="59" font-family="sans-serif" font-weight="700" fill="#646CFF" font-size="11" text-anchor="middle">VITE 8.0</text>
      
      <!-- MIT License Badge -->
      <rect x="0" y="80" width="210" height="30" rx="6" fill="#1e293b" stroke="#10b981" stroke-width="1" />
      <text x="105" y="99" font-family="sans-serif" font-weight="700" fill="#10b981" font-size="11" text-anchor="middle">MIT LICENSE (OPEN SOURCE)</text>
    </g>

    <!-- RIGHT PANEL: Developer details Card -->
    <rect x="420" y="40" width="340" height="320" rx="12" fill="url(#cardGrad)" stroke="url(#borderGrad)" stroke-width="1.5" />
    
    <!-- Profile Avatar Container -->
    <circle cx="480" cy="95" r="30" fill="url(#primaryGrad)" filter="url(#cardGlow)" />
    <!-- Initials -->
    <text x="480" y="102" font-family="sans-serif" font-weight="800" fill="#ffffff" font-size="18" text-anchor="middle">AG</text>

    <text x="530" y="85" class="text-title">Ashish Goswami</text>
    <text x="530" y="105" class="text-body">Flutter &amp; FullStack Developer</text>

    <!-- Social / Contact Rows -->
    <g transform="translate(440, 160)">
      <!-- Name -->
      <text x="0" y="20" class="text-body">Developer:</text>
      <text x="90" y="20" class="text-bold">Ashish Goswami</text>

      <!-- Email -->
      <text x="0" y="50" class="text-body">Gmail:</text>
      <text x="90" y="50" class="text-bold">ashishgoswami6298@gmail.com</text>

      <!-- LinkedIn -->
      <text x="0" y="80" class="text-body">LinkedIn:</text>
      <text x="90" y="80" class="text-bold">in/ashish-goswami-58797a24a</text>

      <!-- Portfolio -->
      <text x="0" y="110" class="text-body">Portfolio:</text>
      <text x="90" y="110" class="text-bold">portfolio-omega-sand-67</text>
    </g>
  </g>
</svg>
