<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 44" width="220" height="44" style="background: transparent;">
  <defs>
    <linearGradient id="linkedinGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0a66c2" />
      <stop offset="100%" stop-color="#004182" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#0a66c2" flood-opacity="0.25" />
    </filter>
  </defs>
  <!-- 3D Shadow Depth -->
  <rect x="0" y="3" width="220" height="40" rx="10" fill="#002244" />
  <!-- Top Face Layer -->
  <rect x="0" y="0" width="220" height="40" rx="10" fill="url(#linkedinGrad)" stroke="rgba(255, 255, 255, 0.2)" stroke-width="1.2" filter="url(#glow)" />
  <!-- LinkedIn Icon -->
  <rect x="27" y="13" width="18" height="18" rx="2" fill="#ffffff" />
  <text x="36" y="27" fill="#0a66c2" font-family="'Segoe UI', sans-serif" font-weight="900" font-size="14" text-anchor="middle">in</text>
  <!-- Title Text -->
  <text x="62" y="24" fill="#ffffff" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-size="11" font-weight="900" letter-spacing="1.5">LINKEDIN</text>
</svg>
